apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: healthcloud-api
  namespace: healthcloud
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: healthcloud-api}
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
