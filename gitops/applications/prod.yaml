apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: { name: healthcloud-prod, namespace: argocd }
spec:
  project: default
  source:
    repoURL: https://github.com/nesibf/healthcloud-poc.git
    targetRevision: main
    path: k8s/overlays/prod
  destination:
    { server: https://kubernetes.default.svc, namespace: healthcloud }
  syncPolicy:
    syncOptions: [CreateNamespace=true]
